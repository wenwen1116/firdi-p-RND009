<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RND-009 研發數據整理平台</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --accent:#38bdf8; --text:#e2e8f0; --muted:#94a3b8; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100vh; background:radial-gradient(circle at 50% -10%,#1e293b,var(--bg)); color:var(--text);
      font-family:-apple-system,"PingFang TC","Segoe UI",system-ui,sans-serif; padding:48px 20px; }
    .wrap { max-width:980px; margin:0 auto; }
    header { text-align:center; margin-bottom:44px; }
    .eyebrow { color:var(--accent); font-size:.85rem; font-weight:600; letter-spacing:2px; text-transform:uppercase; }
    h1 { font-size:2rem; margin:10px 0 12px; }
    .sub { color:var(--muted); max-width:560px; margin:0 auto; line-height:1.7; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px; }
    a.card { display:block; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:26px;
      text-decoration:none; color:inherit; transition:all .18s; }
    a.card:hover { border-color:var(--accent); transform:translateY(-3px); box-shadow:0 12px 30px rgba(0,0,0,.35); }
    .icon { font-size:1.8rem; }
    .card h2 { font-size:1.15rem; margin:14px 0 8px; }
    .card p { color:var(--muted); font-size:.9rem; line-height:1.6; }
    .card .go { color:var(--accent); font-size:.85rem; font-weight:600; margin-top:16px; display:inline-block; }
    footer { text-align:center; color:var(--muted); font-size:.8rem; margin-top:48px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">FIRDI · RND-009</div>
      <h1>研發數據整理平台</h1>
      <p class="sub">RND-009 研發實驗數據的清洗、品管分析與流程展示。從下方三個模組進入。</p>
    </header>

    <div class="grid">
      <a class="card" href="platform.html">
        <div class="icon">📊</div>
        <h2>智能分析平台</h2>
        <p>研發數據整理與視覺化儀表板，互動圖表呈現批號、溫度、水分與評分分布。</p>
        <span class="go">進入 →</span>
      </a>

      <a class="card" href="rnd009-quality-suite.html">
        <div class="icon">🧪</div>
        <h2>資料清洗與品管工作台</h2>
        <p>RND-009 原始資料的清洗、欄位標準化與品質檢核整合工作台。</p>
        <span class="go">進入 →</span>
      </a>

      <a class="card" href="workflow-diagram.html">
        <div class="icon">🔀</div>
        <h2>作業架構流程圖</h2>
        <p>從資料輸入、清理、分析到輸出的完整作業流程與系統架構圖。</p>
        <span class="go">進入 →</span>
      </a>
    </div>

    <footer>© 2026 FIRDI · RND-009 研發數據整理平台</footer>
  </div>
</body>
</html>
